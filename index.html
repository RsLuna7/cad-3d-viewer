<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>三维 CAD 装配体查看器 - 前刹车调整臂五孔钻模</title>
    <meta name="description" content="在浏览器中直接查看 STEP、IGES 和 BREP 三维 CAD 装配体模型，基于 Babylon.js 与 occt-import-js。" />
    <!-- Inline SVG favicon: no extra request, and the site was 404ing on
         /favicon.ico for every visitor. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230066ff'/%3E%3Cpath d='M16 5 27 11v10L16 27 5 21V11z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M5 11l11 6 11-6M16 17v10' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="三维 CAD 装配体查看器" />
    <meta property="og:description" content="浏览器端直接查看前刹车调整臂五孔钻模总装配 STEP/IGES/BREP 模型。" />
</head>
<body>
<div id="app">
    <aside id="sidebar">
        <header class="brand">
            <h1>三维 CAD 查看器</h1>
            <p class="tagline">支持 <code>.step</code> / <code>.iges</code> / <code>.brep</code></p>
        </header>

        <div id="dropzone" class="dropzone">
            <p>拖入模型文件或</p>
            <label class="file-button">
                选择文件
                <input id="file-input" class="sr-only" type="file" accept=".step,.stp,.iges,.igs,.brep" />
            </label>
            <details class="samples" open>
                <summary>预置模型列表</summary>
                <ul id="sample-list"></ul>
            </details>
        </div>

        <section class="toolbar">
            <button id="btn-screenshot" type="button" title="导出 PNG 截图">导出截图</button>
            <button id="btn-measure" type="button" title="两点距离测量">距离测量</button>
            <label class="slider">
                爆炸视图
                <input id="explode-slider" type="range" min="0" max="100" value="0" disabled />
            </label>
        </section>

        <section class="tree">
            <h2>装配结构树</h2>
            <div id="tree-root" class="tree-root"></div>
        </section>

        <section class="info">
            <h2>选中面信息</h2>
            <div id="selection-info" class="selection-info">未选中任何几何面</div>
        </section>

        <footer class="foot">
            <a href="https://github.com/kovacsv/occt-import-js" target="_blank" rel="noopener">occt-import-js</a>
            ·
            <a href="https://www.babylonjs.com/" target="_blank" rel="noopener">Babylon.js</a>
        </footer>
    </aside>

    <main id="viewport">
        <canvas id="renderCanvas" touch-action="none"></canvas>
        <div id="progress" class="progress" role="status" aria-live="polite" hidden>
            <div class="spinner"></div>
            <span id="progress-label">正在加载…</span>
        </div>
        <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>
    </main>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
